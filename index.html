<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            z-index: 10;
            transform: scaleX(-1); /* Mirror the video */
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 20;
        }
        h1 { margin: 0; font-size: 1.5rem; text-shadow: 0 0 10px #00ffff; }
        p { margin: 5px 0; font-size: 0.9rem; opacity: 0.8; }
        .highlight { color: #00ffff; font-weight: bold; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Interactive Particle Morph</h1>
        <p>Current Shape: <span id="shape-name" class="highlight">Sphere</span></p>
        <p>🖐 <b>Move Hand:</b> Rotate/Move Particles</p>
        <p>👌 <b>Pinch:</b> Collapse / ✋ <b>Open:</b> Expand</p>
        <p>👉 <b>Touch Right Edge:</b> Next Shape</p>
    </div>

    <div id="loading">
        <div>Loading AI Vision...</div>
    </div>

    <div id="video-container">
        <video id="input-video" autoplay playsinline muted></video>
    </div>

    <!-- Import Three.js and MediaPipe -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/+esm';

        // --- Configuration ---
        const PARTICLE_COUNT = 12000;
        const PARTICLE_SIZE = 0.08;
        const LERP_SPEED = 0.08; // How fast particles morph
        
        // --- Globals ---
        let scene, camera, renderer, particles, geometry, material;
        let handLandmarker;
        let videoElement = document.getElementById('input-video');
        let shapeNameEl = document.getElementById('shape-name');
        
        // State
        let currentShapeIndex = 0;
        let isSwitchingShape = false; // Debounce for shape switching
        let interactionTarget = new THREE.Vector3(0, 0, 0);
        let pinchStrength = 0; // 0 (open) to 1 (pinched)
        
        // Store target positions for the current shape
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const originalPositions = new Float32Array(PARTICLE_COUNT * 3); // For memory

        // Shapes Enum
        const SHAPES = ['Sphere', 'Heart', 'Flower', 'Saturn', 'Fireworks'];

        async function init() {
            // 1. Setup Three.js
            scene = new THREE.Scene();
            // Add subtle fog for depth
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 2. Create Particles
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            // Initial random positions
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 50;
                colors[i] = 1.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Custom texture for soft particles
            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');

            material = new THREE.PointsMaterial({
                size: PARTICLE_SIZE,
                map: sprite,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // 3. Initialize AI
            await setupMediaPipe();
            
            // 4. Set Initial Shape
            updateShape('Sphere');
            
            // 5. Start Loop
            document.getElementById('loading').style.display = 'none';
            animate();
        }

        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            // Start Webcam
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                videoElement.srcObject = stream;
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        videoElement.play();
                        resolve();
                    };
                });
            }
        }

        // --- Math for Shapes ---

        function calculateShape(type) {
            const positions = [];
            const colors = [];
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z, r, g, b;
                const idx = i;

                if (type === 'Sphere') {
                    const phi = Math.acos(-1 + (2 * idx) / PARTICLE_COUNT);
                    const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                    const rad = 6;
                    
                    x = rad * Math.cos(theta) * Math.sin(phi);
                    y = rad * Math.sin(theta) * Math.sin(phi);
                    z = rad * Math.cos(phi);
                    
                    // Blue/Cyan theme
                    r = 0.1; g = 0.8; b = 1.0; 
                } 
                else if (type === 'Heart') {
                    // Parametric Heart
                    const t = Math.random() * Math.PI * 2;
                    const u = Math.random() * Math.PI; // distribution
                    const rad = 0.35; // Scale
                    
                    // Distribute particles inside volume
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    z = (Math.random() - 0.5) * 4; // Thickness

                    x *= rad; y *= rad; z *= rad;
                    
                    // Red/Pink theme
                    r = 1.0; g = 0.1; b = 0.3;
                }
                else if (type === 'Flower') {
                    // 3D Rose / Rhodonea curve
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const k = 4; // Petals
                    const rad = 5 * Math.cos(k * theta) + 2; 

                    x = rad * Math.sin(phi) * Math.cos(theta);
                    y = rad * Math.sin(phi) * Math.sin(theta);
                    z = rad * Math.cos(phi) * 0.5; // Flatten slightly

                    // Purple/Green
                    r = 0.6 + Math.cos(theta)*0.4; g = 0.2; b = 0.8;
                }
                else if (type === 'Saturn') {
                    // 70% particles in sphere, 30% in ring
                    if (Math.random() > 0.3) {
                        // Planet
                        const phi = Math.acos(-1 + (2 * Math.random()));
                        const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                        const rad = 4;
                        x = rad * Math.cos(theta) * Math.sin(phi);
                        y = rad * Math.sin(theta) * Math.sin(phi);
                        z = rad * Math.cos(phi);
                        r=0.9; g=0.7; b=0.4; // Orange/Brown
                    } else {
                        // Ring
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 6 + Math.random() * 4;
                        x = dist * Math.cos(angle);
                        z = dist * Math.sin(angle);
                        y = (Math.random() - 0.5) * 0.2;
                        // Tilted ring
                        const tilt = 0.4;
                        const tempY = y * Math.cos(tilt) - z * Math.sin(tilt);
                        const tempZ = y * Math.sin(tilt) + z * Math.cos(tilt);
                        y = tempY; z = tempZ;
                        r=0.8; g=0.8; b=0.7; // White/Grey
                    }
                }
                else if (type === 'Fireworks') {
                    // Explosion vectors
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    // Vary radius heavily
                    const rad = Math.pow(Math.random(), 0.5) * 12;
                    
                    x = rad * Math.sin(phi) * Math.cos(theta);
                    y = rad * Math.sin(phi) * Math.sin(theta);
                    z = rad * Math.cos(phi);
                    
                    // Rainbow
                    r = Math.random(); g = Math.random(); b = Math.random();
                }

                targetPositions[i * 3] = x;
                targetPositions[i * 3 + 1] = y;
                targetPositions[i * 3 + 2] = z;

                // We also update colors immediately for effect
                geometry.attributes.color.array[i * 3] = r;
                geometry.attributes.color.array[i * 3 + 1] = g;
                geometry.attributes.color.array[i * 3 + 2] = b;
            }
            geometry.attributes.color.needsUpdate = true;
        }

        function updateShape(name) {
            calculateShape(name);
            shapeNameEl.innerText = name;
        }

        function cycleShape() {
            if (isSwitchingShape) return;
            isSwitchingShape = true;
            
            currentShapeIndex = (currentShapeIndex + 1) % SHAPES.length;
            updateShape(SHAPES[currentShapeIndex]);

            // Prevent rapid cycling
            setTimeout(() => isSwitchingShape = false, 1500);
        }

        // --- Tracking Logic ---
        let lastVideoTime = -1;
        
        async function detectHands() {
            if (!handLandmarker || !videoElement.videoWidth) return;

            if (videoElement.currentTime !== lastVideoTime) {
                lastVideoTime = videoElement.currentTime;
                const result = handLandmarker.detectForVideo(videoElement, performance.now());

                if (result.landmarks && result.landmarks.length > 0) {
                    const lm = result.landmarks[0]; // First hand

                    // 1. Position Tracking (Index Finger Tip - 8)
                    // Map video coords (0-1) to 3D world space (approx -10 to 10)
                    // x is inverted because webcam is mirrored
                    const rawX = 1 - lm[8].x; 
                    const rawY = 1 - lm[8].y; 

                    const x = (rawX - 0.5) * 25; 
                    const y = (rawY - 0.5) * 15; 
                    
                    // Smooth movement
                    interactionTarget.lerp(new THREE.Vector3(x, y, 0), 0.1);

                    // 2. Pinch Detection (Thumb Tip 4 vs Index Tip 8)
                    const thumb = lm[4];
                    const index = lm[8];
                    const dist = Math.sqrt(
                        Math.pow(thumb.x - index.x, 2) + 
                        Math.pow(thumb.y - index.y, 2)
                    );
                    
                    // Distance < 0.05 is a pinch, > 0.1 is open
                    // Map to 0 (open) -> 1 (closed)
                    let strength = 1 - Math.min(Math.max((dist - 0.02) / 0.1, 0), 1);
                    pinchStrength = strength; // 1 = tight pinch, 0 = open hand

                    // 3. Shape Switching Gesture
                    // If hand is on the far right edge of the screen (> 0.9)
                    if ((1-lm[8].x) > 0.9) {
                        cycleShape();
                    }

                } else {
                    // No hand: Reset interaction vars slowly
                    pinchStrength = Math.max(0, pinchStrength - 0.05);
                    interactionTarget.lerp(new THREE.Vector3(0,0,0), 0.05);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            detectHands();

            const positions = geometry.attributes.position.array;
            const colors = geometry.attributes.color.array;

            // Global time for noise
            const time = Date.now() * 0.001;

            // Hand Influence Calculation
            // If pinchStrength is high -> collapse factor is high (implode)
            // If pinchStrength is low (open hand) -> maybe slight expansion or neutral
            const collapseFactor = pinchStrength * 2.5; 
            
            // Interaction Position
            const ix = interactionTarget.x;
            const iy = interactionTarget.y;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const px = positions[i * 3];
                const py = positions[i * 3 + 1];
                const pz = positions[i * 3 + 2];

                const tx = targetPositions[i * 3];
                const ty = targetPositions[i * 3 + 1];
                const tz = targetPositions[i * 3 + 2];

                // 1. Morph towards target shape
                let vx = (tx - px) * LERP_SPEED;
                let vy = (ty - py) * LERP_SPEED;
                let vz = (tz - pz) * LERP_SPEED;

                // 2. Add organic noise (Idle movement)
                vx += Math.sin(time + py * 0.5) * 0.02;
                vy += Math.cos(time + px * 0.5) * 0.02;

                // 3. Hand Interaction
                // Calculate distance to hand
                const dx = px - ix;
                const dy = py - iy;
                const dz = pz - 0; // Hand is roughly at z=0
                const distSq = dx*dx + dy*dy + dz*dz;
                const dist = Math.sqrt(distSq);

                if (dist < 8.0) {
                    // Influence factor based on distance
                    const influence = 1.0 - (dist / 8.0);
                    
                    if (pinchStrength > 0.5) {
                        // ATTRACTION (Pinch) - Pull towards hand
                        vx -= dx * influence * 0.1 * collapseFactor;
                        vy -= dy * influence * 0.1 * collapseFactor;
                        vz -= dz * influence * 0.1 * collapseFactor;
                    } else {
                        // REPULSION/SCATTER (Open Hand) - Push away slightly or turbulence
                        // Or expand the shape
                        const explodeForce = 0.05;
                        vx += (dx / dist) * influence * explodeForce;
                        vy += (dy / dist) * influence * explodeForce;
                        vz += (dz / dist) * influence * explodeForce;
                        
                        // Add some curl noise/rotation around hand
                        vx += -dy * influence * 0.05;
                        vy += dx * influence * 0.05;
                    }
                }

                // Global Expansion based on pinch (Entire shape scaling)
                // If pinched, shrink everything slightly toward center (0,0,0)
                if (pinchStrength > 0.8) {
                    vx -= px * 0.05;
                    vy -= py * 0.05;
                    vz -= pz * 0.05;
                }

                positions[i * 3] += vx;
                positions[i * 3 + 1] += vy;
                positions[i * 3 + 2] += vz;
            }

            geometry.attributes.position.needsUpdate = true;
            
            // Rotate the whole system slowly
            particles.rotation.y += 0.002;
            // Tilt based on hand Y position
            particles.rotation.x = interactionTarget.y * 0.02;
            particles.rotation.z = interactionTarget.x * 0.02;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
